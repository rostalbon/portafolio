<section>
  <div class="container">
    <div class="row">
      <div class="col-sm-4">
        <button (click)="prev()">&#10094;</button>
        <img class="img" [src]="img" alt="">
        <button (click)="next()">&#10095;</button>
      </div>
      <div class="col">
        <p class="name">ROCÍO STALTARI BONMASSAR</p>
        <h2>Habilidades principales</h2>
        <ul>
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
          <li>Python</li>
          <li>Inglés B2</li>
          <li>Sonido y música</li>
          <li>Ciberseguridad</li>
        </ul>
        <h2>Proyectos principales</h2>
        <ul>
          @for (project of projects; track $index) {
            @if (project.isMain == true) {
              <li>
                <div>
                  <a [href]="project.url">{{project.title}} ({{project.year}})</a>
                </div>
              </li>
            }
          }
        </ul>
      </div>
    </div>
  </div>
</section>
