<section>
  <div class="container">
    <h2>Proyectos destacados</h2>
    <ul>
      @for (project of projects; track $index) {
        <li>
          <div>
            <a [href]="project.url">{{project.title}}</a>
            <p>{{project.description}}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
