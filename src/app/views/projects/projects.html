<section>
  <div class="container">
    <div class="group-btn-projects">
      <a routerLink="/upload-project" class="btn-projects">Subir proyecto</a>
      <span class="btn-projects">/</span>
      <a routerLink="/delete-project" class="btn-projects">Eliminar proyecto</a>
    </div>
    <h2>Proyectos destacados</h2>
    <ul>
      @for (project of projects; track $index) {
        <li>
          <div>
            <h5><a [href]="project.url">{{project.title}}</a></h5>
            <p>Año: {{project.year}}</p>
            <p>Tecnologías: {{project.technologies.join(", ")}}</p>
            <p>Descripción: {{project.description}}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</section>
