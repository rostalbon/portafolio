<section>
    <div class="container">
        <div class="row">
            <h2>
                Subir proyecto
            </h2>
        </div>
        <div class="row">
            <form [formGroup]="uploadProjectForm">
                <div class="mb-3">
                    <label for="inputTitle" class="form-label">Título</label>
                    <input formControlName="title" type="text" class="form-control" id="inputTitle">
                </div>
                <div class="mb-3">
                    <label class="form-label">Tecnologías utilizadas</label>
                </div>
                <div class="form-check">
                    <input formControlName="html" class="form-check-input" type="checkbox" id="inputHtml" value="">
                    <label for="inputHtml" class="form-check-label">
                        HTML
                    </label>
                    <br>
                    <input formControlName="css" class="form-check-input" type="checkbox" id="inputCss" value="">
                    <label for="inputCss" class="form-check-label">
                        CSS
                    </label>
                    <br>
                    <input formControlName="javascript" class="form-check-input" type="checkbox" id="inputJavaScript" value="">
                    <label for="inputJavaScript" class="form-check-label">
                        JavaScript
                    </label>
                    <br>
                    <input formControlName="typescript" class="form-check-input" type="checkbox" id="inputTypeScript" value="">
                    <label for="inputTypeScript" class="form-check-label">
                        TypeScript
                    </label>
                    <br>
                    <input formControlName="python" class="form-check-input" type="checkbox" id="inputPython" value="">
                    <label for="inputPython" class="form-check-label">
                        Python
                    </label>
                    <br>
                    <input formControlName="otros" class="form-check-input" type="checkbox" id="inputOtros" value="">
                    <label for="inputOtros" class="form-check-label">
                        Otros
                    </label>
                </div>
                <div class="mb-3">
                    <label for="inputYear" class="form-label">Año</label>
                    <input formControlName="year" type="number" class="form-control" id="inputYear">
                </div>
                <div class="mb-3">
                    <label for="inputUrl" class="form-label">URL GitHub</label>
                    <input formControlName="url" type="url" class="form-control" id="inputUrl">
                </div>
                <div class="mb-3">
                    <label for="inputDescription" class="form-label">Descripción</label>
                    <input formControlName="description" type="text" class="form-control" id="inputDescription">
                </div>
                <div class="mb-3">
                    <label for="inputMain" class="form-label">¿Es un proyecto principal?</label>
                    <br>
                    <input formControlName="main" type="checkbox" class="form-check-input" id="inputMain">
                    <p class="note">(Los proyectos principales se mostrarán en la página de inicio)</p>
                </div>
                <div class="mb-3">
                    <button type="submit" class="submit">Subir</button>
                </div>
            </form>
        </div>
    </div>
</section>
